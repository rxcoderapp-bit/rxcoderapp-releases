<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RXcoderapp 藥局智慧小幫手系統 · 方案調整與維護中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #F0FDF9 0%, #E6F4F1 55%, #F8FAFC 100%);
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.7;
    }
    .card {
      max-width: 580px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(11, 59, 49, 0.11);
      border: 1px solid #D1FAE5;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0B3B31 0%, #1A6B5A 100%);
      color: #FFFFFF;
      padding: 32px 28px;
      text-align: center;
    }
    .pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .body { padding: 28px; }
    .notice {
      background: #F0FDF4;
      border: 1.5px solid #A7F3D0;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 14.5px;
      color: #064E3B;
      margin-bottom: 18px;
    }
    .sub-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: #475569;
      margin-bottom: 20px;
    }
    .contact {
      text-align: center;
      font-size: 13.5px;
      color: #475569;
    }
    .contact a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      background: #1A6B5A;
      color: #FFFFFF;
      font-weight: 800;
      text-decoration: none;
    }
    .contact a:hover { background: #135245; }
    .footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 12px;
      color: #94A3B8;
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="pill">🛠️ 方案調整・網站維護中</div>
      <h1>RXcoderapp 藥局智慧小幫手系統</h1>
      <p>官網內容與授權服務方案升級整理中</p>
    </div>
    <div class="body">
      <div class="notice">
        感謝各位藥師與社區藥局夥伴的支持與回饋！<br>
        本站目前正進行<strong>授權模式與服務方案調整</strong>，暫停對外開放下載與新申請表單，待新版方案確認後將儘速重新上架開放。
      </div>
      <div class="sub-box">
        <strong>📌 既有已安裝用戶說明：</strong><br>
        您本機已安裝之軟體與既有授權憑證皆完全正常運作，不受本次官網頁面調整影響。
      </div>
      <div class="contact">
        <div>若有既有授權協助、功能諮詢或合作聯繫，歡迎來信：</div>
        <a href="mailto:rxcoderapp@gmail.com">✉️ 聯繫開發團隊（rxcoderapp@gmail.com）</a>
      </div>
    </div>
    <div class="footer">RXcoderapp 開發團隊 · 台灣社區藥局日常作業輔助系統</div>
  </main>
</body>
</html>
